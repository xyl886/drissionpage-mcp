[project]
name = "drissionpage-mcp"
version = "1.0.0"
description = "DrissionPage MCP Server — 兼容 DrissionPage 4.0.5.6 与 4.1.x 的浏览器自动化/采集工具集（96 个工具）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xyl886" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "drissionpage",
    "browser-automation",
    "web-scraping",
    "cdp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.0.0",
    "DrissionPage>=4.0.5.6",
]

[project.scripts]
drissionpage-mcp = "drissionpage_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/xyl886/drissionpage-mcp"
Repository = "https://github.com/xyl886/drissionpage-mcp"
Issues = "https://github.com/xyl886/drissionpage-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drissionpage_mcp"]
